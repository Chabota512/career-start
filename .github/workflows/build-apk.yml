name: Build Android APK

# Workflow to build Android APK using EAS
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: false
        default: 'preview'
        type: choice
        options:
          - preview
          - production

jobs:
  build:
    name: Build APK with EAS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK
        run: |
          # Ensure JSON output is parsed correctly whether EAS returns an object or array
          pnpm exec eas build --platform android --profile ${{ github.event.inputs.profile || 'preview' }} --non-interactive --json > eas-build.json
          BUILD_ID=$(jq -r 'if type == "array" then .[0].id else .id end' eas-build.json)
          echo "EAS build ID: $BUILD_ID"
          pnpm exec eas build:download --build-id "$BUILD_ID"
          APK_FILE=$(find . -maxdepth 1 -type f \( -name "*.apk" -o -name "*.aab" \) | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "No APK or AAB artifact found after download"
            exit 1
          fi
          mv "$APK_FILE" ./career-compass.apk
        working-directory: artifacts/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          API_BASE_URL: ${{ secrets.API_BASE_URL || '' }}
          EXPO_PUBLIC_DOMAIN: ${{ secrets.EXPO_PUBLIC_DOMAIN || '' }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: career-compass-apk
          path: artifacts/mobile/career-compass.apk
          retention-days: 30
          if-no-files-found: warn
